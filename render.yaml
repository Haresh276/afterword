services:
  - type: web
    name: afterword
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_CLIENT_EMAIL
        sync: false
      - key: AFTERWORD_SEED_ON_START
        value: "1"
      - key: AFTERWORD_OBJECTION_WINDOW
        value: "30"

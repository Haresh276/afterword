services:
  - type: web
    name: proofpay
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_CLIENT_EMAIL
        sync: false
      - key: PROOFPAY_SEED_ON_START
        value: "1"

# Render's free tier sleeps after 15 idle minutes; a judge opening the demo shouldn't wait a minute.
# One service awake all month is ~720 h, inside the free 750 h. Remove after judging (21 Dec 2026).
name: keep-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://afterword-6xki.onrender.com/api/status
